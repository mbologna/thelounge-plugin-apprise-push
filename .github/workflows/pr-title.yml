name: PR title

# The squash-merge commit takes the PR title as its subject, and auto-release
# reads that subject: the title must be a Conventional Commit.

"on":
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    uses: mbologna/.github/.github/workflows/pr-title.yml@55ad7fd5365891bd47e49c5ea8a7a1c585ea42cb # main
