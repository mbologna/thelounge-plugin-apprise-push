name: CI

"on":
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  ci:
    uses: mbologna/.github/.github/workflows/node-ci.yml@38f7ca7d59dad7be2dfd5607f8758cd51bb41dd2 # main
    with:
      node_version: lts/*
      package_manager: npm
      test_command: "test"
      enable_audit: true
      enable_release_drafter: true

  auto-release:
    # Monday's schedule releases; a manual run on the default branch releases
    # at once. The tag build auto-release dispatches runs on the tag ref, so it
    # does not release again.
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    # contents: push the tag and create the Release; actions: start the npm
    # publish on it. A Release created with GITHUB_TOKEN triggers no
    # `release` run, so publish.yml is dispatched on the tag instead.
    permissions:
      contents: write
      actions: write
    uses: mbologna/.github/.github/workflows/auto-release.yml@38f7ca7d59dad7be2dfd5607f8758cd51bb41dd2 # main
    with:
      strategy: commits
      dispatch_workflow: publish.yml
    secrets: inherit
