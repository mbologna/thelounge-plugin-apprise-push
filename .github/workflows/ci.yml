name: CI

"on":
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  ci:
    uses: mbologna/.github/.github/workflows/node-ci.yml@31ef9e1806fb2404b1e83e71cdb3838a2c56b5c1 # main
    with:
      node_version: lts/*
      package_manager: npm
      test_command: "test"
      enable_audit: true
      enable_release_drafter: true

  auto-release:
    # Monday's schedule and a manual run release with the strategy below; a push
    # to the default branch releases only a CVE fix (the wrapper switches to the
    # security strategy). The tag build auto-release dispatches runs on the tag
    # ref, so it does not release again.
    if: >-
      github.event_name == 'schedule' ||
      ((github.event_name == 'workflow_dispatch' || github.event_name == 'push') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    # contents: push the tag and create the Release; actions: start the npm
    # publish on it. A Release created with GITHUB_TOKEN triggers no
    # `release` run, so publish.yml is dispatched on the tag instead.
    permissions:
      contents: write
      actions: write
    uses: mbologna/.github/.github/workflows/auto-release.yml@31ef9e1806fb2404b1e83e71cdb3838a2c56b5c1 # main
    with:
      strategy: conventional
      dispatch_workflow: publish.yml
    secrets: inherit
