name: CI

"on":
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  ci:
    uses: mbologna/.github/.github/workflows/node-ci.yml@a05097810ce875a71d97a3c61c7d8c8f8646bafe # main
    with:
      node_version: lts/*
      package_manager: npm
      test_command: "test"
      enable_audit: true
      enable_release_drafter: true

  auto-release:
    if: github.event_name == 'schedule'
    uses: mbologna/.github/.github/workflows/auto-release.yml@a05097810ce875a71d97a3c61c7d8c8f8646bafe # main
    with:
      strategy: commits
    secrets: inherit
