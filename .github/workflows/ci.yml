name: CI

"on":
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  # A manual run on main releases whatever is unreleased.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    uses: mbologna/.github/.github/workflows/node-ci.yml@de2007fe3545c975769d756b0008a9789fb0ce96 # main
    with:
      enable_audit: true

  auto-release:
    # contents: push the tag and create the Release; actions: start the npm
    # publish on it. A Release created with GITHUB_TOKEN triggers no
    # `release` run, so publish.yml is dispatched on the tag instead.
    permissions:
      contents: write
      actions: write
    uses: mbologna/.github/.github/workflows/auto-release.yml@de2007fe3545c975769d756b0008a9789fb0ce96 # main
    with:
      strategy: conventional
      dispatch_workflow: publish.yml
    secrets: inherit
